[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --cov=backend
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=50

[coverage:run]
source = backend
omit =
    */tests/*
    */test_*
    */__init__.py
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
